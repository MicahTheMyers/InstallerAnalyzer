name: Build and Release Installer Analyzer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: InstallerAnalyzer

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            [xml]$project = Get-Content './InstallerAnalyzer.csproj'
            $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building Installer Analyzer $version"

      - name: Apply release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $csproj = Get-Content './InstallerAnalyzer.csproj' -Raw
          $csproj = $csproj -replace '<Version>[^<]+</Version>', "<Version>$version</Version>"
          $csproj = $csproj -replace '<AssemblyVersion>[^<]+</AssemblyVersion>', "<AssemblyVersion>$version.0</AssemblyVersion>"
          $csproj = $csproj -replace '<FileVersion>[^<]+</FileVersion>', "<FileVersion>$version.0</FileVersion>"
          Set-Content './InstallerAnalyzer.csproj' $csproj -Encoding UTF8

          $iss = Get-Content './Installer/InstallerAnalyzer.iss' -Raw
          $iss = $iss -replace '#define MyAppVersion "[^"]+"', "#define MyAppVersion `"$version`""
          Set-Content './Installer/InstallerAnalyzer.iss' $iss -Encoding UTF8

      - name: Restore
        run: dotnet restore InstallerAnalyzer.csproj

      - name: Build portable executable
        shell: pwsh
        run: |
          dotnet publish InstallerAnalyzer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o Build
          New-Item -ItemType Directory -Force -Path Release | Out-Null
          Copy-Item 'Build/InstallerAnalyzer.exe' 'Release/InstallerAnalyzer-Portable.exe' -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build setup installer
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler (ISCC.exe) was not found.' }
          & $iscc 'Installer\InstallerAnalyzer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Sign update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          IA_RELEASE_SIGNING_KEY: ${{ secrets.IA_RELEASE_SIGNING_KEY }}
        run: |
          $asset = 'InstallerAnalyzer-Setup.exe'
          $tag = $env:GITHUB_REF_NAME
          $hash = (Get-FileHash -LiteralPath "Release/$asset" -Algorithm SHA256).Hash
          $message = [Text.Encoding]::UTF8.GetBytes("InstallerAnalyzer update v1`n$tag`n$asset`n$hash`n")
          $key = [Security.Cryptography.ECDsa]::Create()
          $verifier = [Security.Cryptography.ECDsa]::Create()
          try {
            $key.ImportFromPem($env:IA_RELEASE_SIGNING_KEY)
            $verifier.ImportFromPem((Get-Content -LiteralPath 'Assets/release-update-public.pem' -Raw))
            $signature = $key.SignData($message, [Security.Cryptography.HashAlgorithmName]::SHA256)
            if (!$verifier.VerifyData($message, $signature, [Security.Cryptography.HashAlgorithmName]::SHA256)) {
              throw 'Release signing key does not match the public key embedded in the app.'
            }
            @{
              schema = 1
              tag = $tag
              asset = $asset
              sha256 = $hash
              signature = [Convert]::ToBase64String($signature)
            } | ConvertTo-Json | Set-Content -LiteralPath 'Release/InstallerAnalyzer-Update.json' -Encoding utf8NoBOM
          } finally {
            $key.Dispose()
            $verifier.Dispose()
          }

      - name: Attest Windows release files
        uses: actions/attest@v4
        with:
          subject-path: |
            InstallerAnalyzer/Release/InstallerAnalyzer-Setup.exe
            InstallerAnalyzer/Release/InstallerAnalyzer-Portable.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstallerAnalyzer-${{ steps.version.outputs.version }}
          path: |
            InstallerAnalyzer/Release/InstallerAnalyzer-Setup.exe
            InstallerAnalyzer/Release/InstallerAnalyzer-Portable.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Installer Analyzer v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            InstallerAnalyzer/Release/InstallerAnalyzer-Setup.exe
            InstallerAnalyzer/Release/InstallerAnalyzer-Portable.exe
            InstallerAnalyzer/Release/InstallerAnalyzer-Update.json
